<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dccb;font-family:"Gowun Dodum",sans-serif;color:#f4f4ee}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.board{padding:30px 26px 40px;background:#2f4a3c radial-gradient(circle at 30% 20%,#3a5a49,#2f4a3c 70%);border:16px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 70px rgba(0,0,0,.35)}
.tray{height:14px;margin:0 24px;background:#a06a3a;border-radius:0 0 8px 8px}
h1{margin:0 0 22px;font:400 44px/1.1 "Black Han Sans",sans-serif}
.lead{margin:0 0 18px;font-size:20px;color:#cfe3d6}
.levels li{margin-bottom:12px}
.level{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:2px dashed rgba(244,244,238,.35);border-radius:8px;background:none;color:inherit;text-align:left}
.level:hover{background:rgba(255,255,255,.06)}
.level b{font:400 26px/1.2 "Black Han Sans",sans-serif}
.level span{font-size:17px;color:#cfe3d6}
.lv{display:inline-block;flex:none;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#1f2d24;vertical-align:middle}
.lv.s1{background:#8ce99a}.lv.s2{background:#c0eb75}.lv.s3{background:#ffe066}.lv.s4{background:#ffa94d}.lv.s5{background:#ff8787}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:18px;color:#cfe3d6}
.chain{margin:18px 0}
.last{margin:0 0 14px}
.last .word{font-size:48px;word-break:break-all}
.last em{font-style:normal;color:#f6e27f}
.btn:disabled,input:disabled{opacity:.5;cursor:default}
.field{display:flex;align-items:flex-end;gap:12px;margin:18px 0 4px;font-size:22px}
.timer{font:400 28px/1 "Black Han Sans",sans-serif;color:#f6e27f}
.chain li{padding:10px 0;border-bottom:2px dashed rgba(244,244,238,.22)}
.who{display:inline-block;width:46px;font-size:16px;color:#cfe3d6}
.word{font:400 30px/1.2 "Black Han Sans",sans-serif;vertical-align:middle}
.ai .word{color:#9fd8ff}
.num{display:inline-block;width:36px;font-size:16px;color:#f6e27f}
.mean{margin:4px 0 0 82px;font-size:17px;line-height:1.5;color:#e3ece6}
.mean:empty{display:none}
.play{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;font-size:22px}
.need{font:400 56px/1.2 "Black Han Sans",sans-serif;color:#f6e27f}
.chalkline{flex:1;min-width:160px;border-bottom:4px solid #f6e27f}
.chalkline input{width:100%;padding:0;border:0;background:none;font:400 40px/1.3 "Black Han Sans",sans-serif;color:#f6e27f}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{min-height:48px;padding:6px 18px;border:2px solid #f4f4ee;border-radius:8px;background:none;color:inherit;font-size:19px}
.btn.main{background:#f6e27f;border-color:#f6e27f;color:#1f2d24;font-weight:700}
.msg{min-height:1.6em;margin:14px 0 0;font-size:19px;line-height:1.6;color:#ffd8a8}
.end{margin:0 0 10px;font:400 40px/1.2 "Black Han Sans",sans-serif}
.source{margin:14px 8px 0;font-size:13px;line-height:1.6;color:#6b5a45}
.source a{color:inherit}
@media (max-width:520px){
  .board{padding:22px 16px 30px;border-width:10px}
  h1{font-size:36px}
  .need{font-size:44px}
  .chalkline input{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <h1>끝말잇기 대결</h1>
    <div class="out"><p class="lead">단어를 불러오는 중이에요.</p></div>
  </div>
  <div class="tray"></div>
  <p class="source">단어: 국립국어원 <a href="https://stdict.korean.go.kr">표준국어대사전</a>, <a href="https://opendict.korean.go.kr">우리말샘</a>(방언·북한어·옛말), <a href="https://krdict.korean.go.kr">한국어기초사전</a> (CC BY-SA 2.0 KR)<br>
  단어 등급: 국립국어원 「국어 기초 어휘 선정 및 어휘 등급화 목록」(공공누리 제1유형)</p>
</div>

<script>
// 단계별 AI: pool=AI가 쓰는 단어 범위, hard=가장 잇기 어려운 단어를 고를 확률, kill=한방 단어 사용 여부
const LEVELS = [
  {name:"1단계 쉬움", desc:"쉬운 낱말만 써요.",                             pool:1, hard:0,   kill:false},
  {name:"2단계 중급", desc:"초등 중학년 낱말까지 써요.",                    pool:2, hard:0,   kill:false},
  {name:"3단계 고급", desc:"어려운 낱말도 쓰고, 가끔 잇기 힘든 말을 내요.", pool:3, hard:0.1, kill:false},
  {name:"4단계 도전", desc:"사전 낱말을 쓰고, 한방 단어도 섞어요.",          pool:4, hard:0.3, kill:true},
  {name:"5단계 끝장", desc:"표준국어대사전을 다 쓰고, 끝장 단어만 노려요.",  pool:5, hard:1,   kill:true}
];

// 두음법칙: 첫소리 ㄹ → ㄴ/ㅇ, ㄴ → ㅇ (ㅑㅒㅕㅖㅛㅠㅣ 앞)
function dueum(s){
  const c = s.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return s;
  let cho = Math.floor(c / 588);
  const jung = Math.floor(c % 588 / 28), jong = c % 28;
  const y = [2,3,6,7,12,17,20].includes(jung);
  if (cho === 5) cho = y ? 11 : 2;
  else if (cho === 2 && y) cho = 11;
  return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
}
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = w => [...w].map(ch => CHO[Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)]).join("");
const last = w => w[w.length - 1];
const heads = e => dueum(e) === e ? [e] : [e, dueum(e)];
const lab = e => dueum(e) === e ? `‘${e}’` : `‘${e}’(${dueum(e)})`;
const pick = a => a[Math.floor(Math.random() * a.length)];

const WORDS = new Map();     // 단어 → {word, lv, meaning}
const BY_FIRST = new Map();  // 첫 글자 → 단어 목록
const starts = e => heads(e).flatMap(h => BY_FIRST.get(h) || []);
const cont = w => heads(last(w)).reduce((n, h) => n + (BY_FIRST.get(h) || []).length, 0);  // 끝 글자로 이을 수 있는 단어 수 (0이면 한방 단어)

// 기초 어휘 밖 낱말의 뜻은 meanings/번호.json 에 나눠 두고, 화면에 나올 때 그 파일만 받는다 (번호 계산은 scripts/build_meanings.py 와 같다)
const MEANS = new Map();  // 파일 번호 → {낱말: 뜻} (받는 중이면 Promise)
const bucket = w => { let h = 0; for (const ch of w) h = (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0; return h % 509; };
function mean(word){
  const m = WORDS.get(word).meaning, b = bucket(word), got = MEANS.get(b);
  if (m || got && !(got instanceof Promise)) return m || got[word] || "";
  if (!got) MEANS.set(b, fetch(`meanings/${b}.json`).then(r => r.json())
    .then(d => { MEANS.set(b, d); for (const p of out.querySelectorAll(".mean:empty")) p.textContent = mean(p.dataset.w); })
    .catch(() => MEANS.delete(b)));
  return "";
}

const out = document.querySelector(".out");
let level, chain, used, hints, myFirst, aiFirst;
// 같이하기: net=Firebase 연결(online.js), me=host/guest, room=방 정보, turnStart=이번 차례가 시작된 시각
const ONLINE = {name:"같이하기"};
const LIMIT = 25;  // 같이하기 한 차례 제한 시간(초)
let net, code, me, room, turnStart, ended, unwatch, timer;
let nick = "";
try { nick = localStorage.getItem("wordchain-nickname") || ""; } catch (e) {}

const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const online = () => level === ONLINE;
const other = s => s === "host" ? "guest" : "host";
const whoAt = i => i % 2 === 0 ? room.first : other(room.first);
const myTurn = () => room.status === "playing" && whoAt(room.chain.length) === me;
const opp = () => online() ? esc(me === "host" ? room.guestName : room.hostName) : "AI";

function home(){
  out.innerHTML = `<p class="lead">AI와 혼자 하거나, 방 코드로 친구와 같이 해요.</p>
    <ul class="levels">
      <li><button class="level" data-act="solo"><span><b>혼자하기</b><br><span>AI와 5단계 난이도로 대결해요.</span></span></button></li>
      <li><button class="level" data-act="together"><span><b>같이하기</b><br><span>방을 만들고 코드를 알려 주면 친구와 대결해요.</span></span></button></li>
    </ul>`;
}

function solo(){
  out.innerHTML = `<p class="lead">단계를 골라 AI와 끝말잇기를 해요. 내가 먼저 시작해요.</p>
    <ul class="levels">${LEVELS.map((l, i) => `<li><button class="level" data-level="${i}">
      <span class="lv s${i + 1}">${i + 1}</span><span><b>${l.name.slice(4)}</b><br><span>${l.desc}</span></span>
    </button></li>`).join("")}</ul>
    <p class="lead">규칙: 두 글자 이상 명사 · 두음법칙 허용 · 같은 말 다시 쓰기 금지 · 첫 단어로 한방 단어 금지</p>
    <div class="btns"><button class="btn" data-act="home">처음으로</button></div>`;
}

function start(i){
  level = LEVELS[i]; chain = []; used = new Set(); hints = 0; myFirst = aiFirst = true;
  draw("첫 단어를 써 보세요.");
}

function line(c, i){
  return `<li class="${c.ai ? "ai" : ""}"><span class="num">${chain.length - i}</span><span class="who">${c.ai ? opp() : "나"}</span><span class="word">${c.word}</span>
    <p class="mean" data-w="${c.word}">${esc(mean(c.word))}</p></li>`;
}

// wait=true 이면 상대(AI)가 생각하는 중이라 입력과 버튼을 막는다
function draw(msg, wait){
  const c = chain[chain.length - 1], e = c ? last(c.word) : "", off = wait ? "disabled" : "";
  out.innerHTML = `<div class="top">${online() ? `<span class="lv s3">나 vs ${opp()}</span><span class="timer"></span>`
      : `<span class="lv s${LEVELS.indexOf(level) + 1}">${level.name}</span><span>${chain.length}번째 말</span>`}</div>
    ${c ? `<p class="last${c.ai ? " ai" : ""}"><span class="who">${c.ai ? opp() : "나"}</span><span class="word">${c.word.slice(0, -1)}<em>${e}</em></span></p>` : ""}
    <form class="play">
      ${e ? `<span class="need">${lab(e)}</span>` : ""}
      <span class="chalkline"><input aria-label="내 단어" autocomplete="off" enterkeyhint="send" ${off}></span>
    </form>
    <div class="btns"><button class="btn main" data-act="send" ${off}>내기</button>${online() ? "" : `<button class="btn" data-act="hint" ${off}>힌트</button>`}<button class="btn" data-act="quit" ${online() ? "" : off}>기권</button></div>
    <p class="msg">${msg}</p>
    <ul class="chain">${chain.slice().reverse().map(line).join("")}</ul>`;
  if (!wait) out.querySelector("input").focus();
}

function finish(win, why){
  out.innerHTML = `<p class="end">${win ? "이겼어요!" : "졌어요."}</p>
    <p class="lead">${why}</p>
    <p class="lead">${chain.length}개의 말을 이었어요.${online() ? "" : ` 힌트 ${hints}번.`}</p>
    <ul class="chain">${chain.slice().reverse().map(line).join("")}</ul>
    <div class="btns">${online() ? `<button class="btn main" data-act="rematch">다시 하기</button><button class="btn" data-act="leave">나가기</button>`
      : `<button class="btn main" data-act="again">다시 하기</button><button class="btn" data-act="solo">단계 바꾸기</button>`}</div>`;
}

function say(msg){ out.querySelector(".msg").textContent = msg; }

function send(){
  const input = out.querySelector("input"), word = input.value.trim();
  const e = chain.length ? last(chain[chain.length - 1].word) : "";
  if (online()) {
    if (!myTurn()) return;
    myFirst = !chain.some(c => !c.ai);
  }
  if (!/^[가-힣]{2,}$/.test(word)) return say("두 글자 이상 한글로 써 주세요.");
  if (e && !heads(e).includes(word[0])) return say(`${lab(e)}(으)로 시작해야 해요.`);
  if (!WORDS.has(word)) return say(`‘${word}’은(는) 사전에 없는 말이에요.`);
  if (used.has(word)) return say(`‘${word}’은(는) 이미 나온 말이에요.`);
  if (myFirst && !cont(word)) return say("첫 단어로는 한방 단어를 쓸 수 없어요.");
  if (online()) return net.play(code, me, word, !cont(word)).catch(() => say("보내지 못했어요. 다시 눌러 보세요."));
  myFirst = false;
  used.add(word); chain.push({word});
  if (!cont(word)) return finish(true, `한방 단어 ‘${word}’! ${lab(last(word))}(으)로 시작하는 말이 없어요.`);
  draw("AI가 생각하고 있어요…", true);
  setTimeout(aiTurn, 1000);
}

function aiTurn(){
  const e = last(chain[chain.length - 1].word);
  let cand = starts(e).filter(w => w.lv && w.lv <= level.pool && !used.has(w.word));
  if (!level.kill || aiFirst) cand = cand.filter(w => cont(w.word));
  if (!cand.length) return finish(true, `AI가 ${lab(e)}(으)로 시작하는 말을 찾지 못했어요.`);
  let w = pick(cand);
  if (Math.random() < level.hard) {
    const min = Math.min(...cand.map(c => cont(c.word)));
    w = pick(cand.filter(c => cont(c.word) === min));
  }
  aiFirst = false;
  used.add(w.word); chain.push({word: w.word, ai: true});
  if (!cont(w.word)) return finish(false, `AI의 한방 단어 ‘${w.word}’! ${lab(last(w.word))}(으)로 시작하는 말이 없어요.`);
  draw(`${lab(last(w.word))}(으)로 이어 보세요.`);
}

function hint(){
  const e = chain.length ? last(chain[chain.length - 1].word) : "";
  const cand = (e ? starts(e) : [...WORDS.values()]).filter(w => w.lv && !used.has(w.word) && cont(w.word));
  if (!cand.length) return say("줄 수 있는 힌트가 없어요.");
  const easy = cand.filter(w => w.meaning), w = pick(easy.length ? easy : cand);
  hints++;
  // 기초 어휘가 없으면 뜻 파일을 받아 뜻을 보여 주고, 뜻을 못 찾을 때만 초성을 보여 준다
  const n = chain.length;
  mean(w.word);
  Promise.resolve(MEANS.get(bucket(w.word))).then(() => chain.length === n && say(`힌트: ${mean(w.word) || chosung(w.word)}`));
}

// ===== 같이하기 =====
function together(msg){
  out.innerHTML = `<p class="lead">방을 만들어 코드를 알려 주거나, 받은 코드로 들어가요. 한 차례에 ${LIMIT}초 안에 답해야 해요.</p>
    <label class="field"><span>닉네임</span><span class="chalkline"><input id="nick" maxlength="10" autocomplete="off" value="${esc(nick)}"></span></label>
    <div class="btns"><button class="btn main" data-act="create">방 만들기</button></div>
    <label class="field"><span>방 코드</span><span class="chalkline"><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"></span></label>
    <div class="btns"><button class="btn main" data-act="join">들어가기</button><button class="btn" data-act="home">처음으로</button></div>
    <p class="msg">${msg || ""}</p>`;
}

async function enter(act){
  const name = out.querySelector("#nick").value.trim(), c = out.querySelector("#code").value.trim();
  if (!name) return say("닉네임을 써 주세요.");
  if (act === "join" && !/^\d{4}$/.test(c)) return say("방 코드 네 자리를 써 주세요.");
  say("연결하는 중이에요…");
  try {
    net = net || await import("./online.js");
    if (await net.containsProfanity(name)) return say("닉네임에 쓸 수 없는 말이 있어요.");
    nick = name;
    try { localStorage.setItem("wordchain-nickname", name); } catch (e) {}
    if (act === "create") { code = await net.create(name); me = "host"; }
    else {
      const err = await net.join(c, name);
      if (err) return say(err);
      code = c; me = "guest";
    }
  } catch (e) { return say("연결하지 못했어요. 잠시 뒤 다시 해 보세요."); }
  level = ONLINE; room = null;
  unwatch = net.watch(code, onRoom);
  timer = setInterval(tick, 250);
}

function onRoom(r){
  if (!r) { stop(); return together("방이 닫혔어요. 상대가 나갔을 수 있어요."); }
  const prev = room;
  room = r;
  if (r.status === "waiting") return out.innerHTML = `<p class="lead">방 코드</p><p class="end">${code}</p>
    <p class="lead">상대에게 이 코드를 알려 주세요. 들어오면 바로 시작해요.</p>
    <div class="btns"><button class="btn" data-act="leave">나가기</button></div>`;
  if (prev && prev.status === r.status && prev.chain.length === r.chain.length) return;  // 바뀐 것이 없으면 다시 그리지 않는다
  chain = r.chain.map((word, i) => ({word, ai: whoAt(i) !== me}));
  used = new Set(r.chain);
  turnStart = Date.now(); ended = false;
  if (r.status === "over") return finish(r.winner === me, why(r));
  const c = chain[chain.length - 1];
  draw(myTurn() ? (c ? `${lab(last(c.word))}(으)로 이어 보세요.` : "내가 먼저예요. 첫 단어를 써 보세요.") : `${opp()}의 차례예요.`, !myTurn());
}

function why(r){
  const w = r.chain[r.chain.length - 1], win = r.winner === me;
  if (r.reason === "kill") return `${win ? "" : opp() + "의 "}한방 단어 ‘${w}’! ${lab(last(w))}(으)로 시작하는 말이 없어요.`;
  if (r.reason === "quit") return win ? `${opp()}이(가) 기권했어요.` : "기권했어요.";
  if (r.reason === "time") return win ? `${opp()}이(가) 시간 안에 답하지 못했어요.` : "시간이 다 됐어요.";
  return `${opp()}의 응답이 없어요.`;
}

// 남은 시간 표시. 내 차례에 시간이 다 되면 지고, 상대 차례가 한참 지나도 응답이 없으면 이긴다.
function tick(){
  if (!room || room.status !== "playing" || ended) return;
  const left = Math.ceil(LIMIT - (Date.now() - turnStart) / 1000), el = out.querySelector(".timer");
  if (el) el.textContent = `${Math.max(left, 0)}초`;
  if (myTurn() && left <= 0) { ended = true; net.end(code, other(me), "time"); }
  else if (!myTurn() && left <= -5) { ended = true; net.end(code, me, "gone"); }
}

function stop(){
  if (unwatch) unwatch();
  clearInterval(timer);
  unwatch = null; room = null; level = null;
}

function leave(){
  const c = code;
  stop();
  net.remove(c).catch(() => {});
  home();
}

out.addEventListener("submit", ev => { ev.preventDefault(); send(); });
out.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.level) return start(+b.dataset.level);
  const act = b.dataset.act;
  if (act === "send") send();
  else if (act === "hint") hint();
  else if (act === "quit") online() ? net.end(code, other(me), "quit") : finish(false, "기권했어요.");
  else if (act === "again") start(LEVELS.indexOf(level));
  else if (act === "solo") solo();
  else if (act === "home") home();
  else if (act === "together") together();
  else if (act === "create" || act === "join") enter(act);
  else if (act === "rematch") net.rematch(code);
  else if (act === "leave") leave();
});

fetch("words.json").then(r => r.json()).then(data => {
  for (const [word, lv, meaning] of data) {
    const w = {word, lv, meaning};
    WORDS.set(word, w);
    if (!BY_FIRST.has(word[0])) BY_FIRST.set(word[0], []);
    BY_FIRST.get(word[0]).push(w);
  }
  home();
}).catch(() => { out.innerHTML = `<p class="lead">단어를 불러오지 못했어요. 새로고침해 보세요.</p>`; });
</script>
</body>
