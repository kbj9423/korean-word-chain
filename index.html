<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dccb;font-family:"Gowun Dodum",sans-serif;color:#f4f4ee}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.board{padding:30px 26px 40px;background:#2f4a3c radial-gradient(circle at 30% 20%,#3a5a49,#2f4a3c 70%);border:16px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 70px rgba(0,0,0,.35)}
.tray{height:14px;margin:0 24px;background:#a06a3a;border-radius:0 0 8px 8px}
h1{margin:0 0 22px;font:400 44px/1.1 "Black Han Sans",sans-serif}
.lead{margin:0 0 18px;font-size:20px;color:#cfe3d6}
.levels li{margin-bottom:12px}
.level{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:2px dashed rgba(244,244,238,.35);border-radius:8px;background:none;color:inherit;text-align:left}
.level:hover{background:rgba(255,255,255,.06)}
.level b{font:400 26px/1.2 "Black Han Sans",sans-serif}
.level span{font-size:17px;color:#cfe3d6}
.lv{display:inline-block;flex:none;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#1f2d24;vertical-align:middle}
.lv.s1{background:#8ce99a}.lv.s2{background:#c0eb75}.lv.s3{background:#ffe066}.lv.s4{background:#ffa94d}.lv.s5{background:#ff8787}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:18px;color:#cfe3d6}
.chain{margin:18px 0}
.last{margin:0 0 14px}
.last .word{font-size:48px;word-break:break-all}
.last em{font-style:normal;color:#f6e27f}
.btn:disabled,input:disabled{opacity:.5;cursor:default}
.chain li{padding:10px 0;border-bottom:2px dashed rgba(244,244,238,.22)}
.who{display:inline-block;width:46px;font-size:16px;color:#cfe3d6}
.word{font:400 30px/1.2 "Black Han Sans",sans-serif;vertical-align:middle}
.ai .word{color:#9fd8ff}
.mean{margin:4px 0 0 46px;font-size:17px;line-height:1.5;color:#e3ece6}
.play{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;font-size:22px}
.need{font:400 56px/1.2 "Black Han Sans",sans-serif;color:#f6e27f}
.chalkline{flex:1;min-width:160px;border-bottom:4px solid #f6e27f}
.chalkline input{width:100%;padding:0;border:0;background:none;font:400 40px/1.3 "Black Han Sans",sans-serif;color:#f6e27f}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{min-height:48px;padding:6px 18px;border:2px solid #f4f4ee;border-radius:8px;background:none;color:inherit;font-size:19px}
.btn.main{background:#f6e27f;border-color:#f6e27f;color:#1f2d24;font-weight:700}
.msg{min-height:1.6em;margin:14px 0 0;font-size:19px;line-height:1.6;color:#ffd8a8}
.end{margin:0 0 10px;font:400 40px/1.2 "Black Han Sans",sans-serif}
.source{margin:14px 8px 0;font-size:13px;line-height:1.6;color:#6b5a45}
.source a{color:inherit}
@media (max-width:520px){
  .board{padding:22px 16px 30px;border-width:10px}
  h1{font-size:36px}
  .need{font-size:44px}
  .chalkline input{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <h1>끝말잇기 대결</h1>
    <div class="out"><p class="lead">단어를 불러오는 중이에요.</p></div>
  </div>
  <div class="tray"></div>
  <p class="source">단어: 국립국어원 <a href="https://stdict.korean.go.kr">표준국어대사전</a>, <a href="https://opendict.korean.go.kr">우리말샘</a>(방언·북한어·옛말), <a href="https://krdict.korean.go.kr">한국어기초사전</a> (CC BY-SA 2.0 KR)<br>
  단어 등급: 국립국어원 「국어 기초 어휘 선정 및 어휘 등급화 목록」(공공누리 제1유형)</p>
</div>

<script>
// 단계별 AI: pool=AI가 쓰는 단어 범위, hard=가장 잇기 어려운 단어를 고를 확률, kill=한방 단어 사용 여부, learn=뜻 보여주기
const LEVELS = [
  {name:"1단계 쉬움", desc:"쉬운 낱말만 써요. 뜻도 알려 줘요.",            pool:1, hard:0,   kill:false, learn:true},
  {name:"2단계 중급", desc:"초등 중학년 낱말까지 써요. 뜻도 알려 줘요.",    pool:2, hard:0,   kill:false, learn:true},
  {name:"3단계 고급", desc:"어려운 낱말도 쓰고, 가끔 잇기 힘든 말을 내요.", pool:3, hard:0.1, kill:false, learn:false},
  {name:"4단계 도전", desc:"사전 낱말을 쓰고, 한방 단어도 섞어요.",          pool:4, hard:0.3, kill:true,  learn:false},
  {name:"5단계 끝장", desc:"표준국어대사전을 다 쓰고, 끝장 단어만 노려요.",  pool:5, hard:1,   kill:true,  learn:false}
];

// 두음법칙: 첫소리 ㄹ → ㄴ/ㅇ, ㄴ → ㅇ (ㅑㅒㅕㅖㅛㅠㅣ 앞)
function dueum(s){
  const c = s.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return s;
  let cho = Math.floor(c / 588);
  const jung = Math.floor(c % 588 / 28), jong = c % 28;
  const y = [2,3,6,7,12,17,20].includes(jung);
  if (cho === 5) cho = y ? 11 : 2;
  else if (cho === 2 && y) cho = 11;
  return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
}
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = w => [...w].map(ch => CHO[Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)]).join("");
const last = w => w[w.length - 1];
const heads = e => dueum(e) === e ? [e] : [e, dueum(e)];
const lab = e => dueum(e) === e ? `‘${e}’` : `‘${e}’(${dueum(e)})`;
const pick = a => a[Math.floor(Math.random() * a.length)];

const WORDS = new Map();     // 단어 → {word, lv, meaning}
const BY_FIRST = new Map();  // 첫 글자 → 단어 목록
const starts = e => heads(e).flatMap(h => BY_FIRST.get(h) || []);
const cont = w => heads(last(w)).reduce((n, h) => n + (BY_FIRST.get(h) || []).length, 0);  // 끝 글자로 이을 수 있는 단어 수 (0이면 한방 단어)

const out = document.querySelector(".out");
let level, chain, used, hints, myFirst, aiFirst;

function home(){
  out.innerHTML = `<p class="lead">단계를 골라 AI와 끝말잇기를 해요. 내가 먼저 시작해요.</p>
    <ul class="levels">${LEVELS.map((l, i) => `<li><button class="level" data-level="${i}">
      <span class="lv s${i + 1}">${i + 1}</span><span><b>${l.name.slice(4)}</b><br><span>${l.desc}</span></span>
    </button></li>`).join("")}</ul>
    <p class="lead">규칙: 두 글자 이상 명사 · 두음법칙 허용 · 같은 말 다시 쓰기 금지 · 첫 단어로 한방 단어 금지</p>`;
}

function start(i){
  level = LEVELS[i]; chain = []; used = new Set(); hints = 0; myFirst = aiFirst = true;
  draw("첫 단어를 써 보세요.");
}

function line(c){
  const w = WORDS.get(c.word);
  return `<li class="${c.ai ? "ai" : ""}"><span class="who">${c.ai ? "AI" : "나"}</span><span class="word">${c.word}</span>
    ${level.learn && w.meaning ? `<p class="mean">${w.meaning}</p>` : ""}</li>`;
}

// wait=true 이면 AI가 생각하는 중이라 입력과 버튼을 막는다
function draw(msg, wait){
  const c = chain[chain.length - 1], e = c ? last(c.word) : "", off = wait ? "disabled" : "";
  out.innerHTML = `<div class="top"><span class="lv s${LEVELS.indexOf(level) + 1}">${level.name}</span><span>${chain.length}번째 말</span></div>
    ${c ? `<p class="last${c.ai ? " ai" : ""}"><span class="who">${c.ai ? "AI" : "나"}</span><span class="word">${c.word.slice(0, -1)}<em>${e}</em></span></p>` : ""}
    <form class="play">
      ${e ? `<span class="need">${lab(e)}</span>` : ""}
      <span class="chalkline"><input aria-label="내 단어" autocomplete="off" enterkeyhint="send" ${off}></span>
    </form>
    <div class="btns"><button class="btn main" data-act="send" ${off}>내기</button><button class="btn" data-act="hint" ${off}>힌트</button><button class="btn" data-act="quit" ${off}>기권</button></div>
    <p class="msg">${msg}</p>
    <ul class="chain">${chain.slice().reverse().map(line).join("")}</ul>`;
  if (!wait) out.querySelector("input").focus();
}

function finish(win, why){
  out.innerHTML = `<p class="end">${win ? "이겼어요!" : "졌어요."}</p>
    <p class="lead">${why}</p>
    <p class="lead">${chain.length}개의 말을 이었어요. 힌트 ${hints}번.</p>
    <ul class="chain">${chain.slice().reverse().map(line).join("")}</ul>
    <div class="btns"><button class="btn main" data-act="again">다시 하기</button><button class="btn" data-act="home">단계 바꾸기</button></div>`;
}

function say(msg){ out.querySelector(".msg").textContent = msg; }

function send(){
  const input = out.querySelector("input"), word = input.value.trim();
  const e = chain.length ? last(chain[chain.length - 1].word) : "";
  if (!/^[가-힣]{2,}$/.test(word)) return say("두 글자 이상 한글로 써 주세요.");
  if (e && !heads(e).includes(word[0])) return say(`${lab(e)}(으)로 시작해야 해요.`);
  if (!WORDS.has(word)) return say(`‘${word}’은(는) 사전에 없는 말이에요.`);
  if (used.has(word)) return say(`‘${word}’은(는) 이미 나온 말이에요.`);
  if (myFirst && !cont(word)) return say("첫 단어로는 한방 단어를 쓸 수 없어요.");
  myFirst = false;
  used.add(word); chain.push({word});
  if (!cont(word)) return finish(true, `한방 단어 ‘${word}’! ${lab(last(word))}(으)로 시작하는 말이 없어요.`);
  draw("AI가 생각하고 있어요…", true);
  setTimeout(aiTurn, 1000);
}

function aiTurn(){
  const e = last(chain[chain.length - 1].word);
  let cand = starts(e).filter(w => w.lv && w.lv <= level.pool && !used.has(w.word));
  if (!level.kill || aiFirst) cand = cand.filter(w => cont(w.word));
  if (!cand.length) return finish(true, `AI가 ${lab(e)}(으)로 시작하는 말을 찾지 못했어요.`);
  let w = pick(cand);
  if (Math.random() < level.hard) {
    const min = Math.min(...cand.map(c => cont(c.word)));
    w = pick(cand.filter(c => cont(c.word) === min));
  }
  aiFirst = false;
  used.add(w.word); chain.push({word: w.word, ai: true});
  if (!cont(w.word)) return finish(false, `AI의 한방 단어 ‘${w.word}’! ${lab(last(w.word))}(으)로 시작하는 말이 없어요.`);
  draw(`${lab(last(w.word))}(으)로 이어 보세요.`);
}

function hint(){
  const e = chain.length ? last(chain[chain.length - 1].word) : "";
  const cand = (e ? starts(e) : [...WORDS.values()]).filter(w => w.lv && !used.has(w.word) && cont(w.word));
  if (!cand.length) return say("줄 수 있는 힌트가 없어요.");
  const easy = cand.filter(w => w.meaning), w = pick(easy.length ? easy : cand);
  hints++;
  say(`힌트: ${chosung(w.word)}${w.meaning ? " — " + w.meaning : ""}`);
}

out.addEventListener("submit", ev => { ev.preventDefault(); send(); });
out.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.level) return start(+b.dataset.level);
  const act = b.dataset.act;
  if (act === "send") send();
  else if (act === "hint") hint();
  else if (act === "quit") finish(false, "기권했어요.");
  else if (act === "again") start(LEVELS.indexOf(level));
  else if (act === "home") home();
});

fetch("words.json").then(r => r.json()).then(data => {
  for (const [word, lv, meaning] of data) {
    const w = {word, lv, meaning};
    WORDS.set(word, w);
    if (!BY_FIRST.has(word[0])) BY_FIRST.set(word[0], []);
    BY_FIRST.get(word[0]).push(w);
  }
  home();
}).catch(() => { out.innerHTML = `<p class="lead">단어를 불러오지 못했어요. 새로고침해 보세요.</p>`; });
</script>
</body>
</html>
